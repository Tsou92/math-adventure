name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    # ubuntu-latest is Ubuntu 26.04. Playwright 1.58.2 has no Chromium build
    # for ubuntu26.04-x64, so `playwright install --with-deps` fails before e2e.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: math_adventure_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/math_adventure_test
      - run: npm run build
      - run: npm run build:vercel
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
